name: E2E
# 端對端測試：在 GitHub 的機器上開瀏覽器，用機器人從頭玩到尾。
# 與「部署到 GitHub Pages」分開，失敗只會通知，不會擋住網站更新。
on:
  push:
    # 只改文件、規格、計畫、這個流程檔本身時不用跑（程式沒變，測了也一樣）
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - run: npm run build
      - name: 開本機伺服器
        run: |
          nohup npx vite preview --port 5190 --host 127.0.0.1 > preview.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:5190/ > /dev/null && break; sleep 1; done
      - name: 機器人玩一遍
        run: STARTER=momo node tests/e2e/play.mjs http://127.0.0.1:5190/ e2e-shots
      - name: 上傳截圖
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-shots
          path: e2e-shots
          if-no-files-found: ignore
